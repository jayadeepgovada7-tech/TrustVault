{% extends "base.html" %}{% block title %}Settings - TrustVault{% endblock %}{% block content %}<div class="container py-3"><p class="royal-kicker">PREFERENCES & SECURITY</p><h1 class="h2">Settings</h1><p class="text-secondary mb-4">Update your account security.</p><div class="row"><div class="col-lg-7"><div class="card shadow-sm"><div class="card-body p-4"><h2 class="h5 mb-3"><i class="bi bi-shield-lock me-2 text-warning"></i>Change password</h2><form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label" for="current_password">Current password</label><input class="form-control mb-3" type="password" id="current_password" name="current_password" required autocomplete="current-password"><label class="form-label" for="new_password">New password</label><input class="form-control mb-3" type="password" id="new_password" name="new_password" required autocomplete="new-password"><label class="form-label" for="confirm_password">Confirm new password</label><input class="form-control mb-3" type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password"><small class="text-secondary d-block mb-3">At least 8 characters, uppercase, lowercase, number and special character.</small><button class="btn royal-signin-btn" type="submit">Update password</button></form></div></div></div></div></div>{% endblock %}
