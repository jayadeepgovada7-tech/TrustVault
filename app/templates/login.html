{% extends "base.html" %}

{% block title %}Login - Trust vault{% endblock %}

{% block content %}
<div class="row justify-content-center pt-4">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4">
            <div class="card-header bg-dark text-white text-center py-4 rounded-top-4 border-0">
                <i class="bi bi-shield-lock text-primary display-4 mb-2"></i>
                <h3 class="fw-bold mb-0">Trust&nbsp;<span class="text-primary">vault</span> Access</h3>
                <p class="text-muted small mb-0">Trust vault — Zero-Trust Protected Document Repository</p>
            </div>
            <div class="card-body p-4 p-md-5">
                <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" required autofocus placeholder="name@example.com">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Secure Sign In
                    </button>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                    <p class="small text-muted mb-0">Don't have an account? <a href="{{ url_for('auth.register') }}" class="fw-semibold">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
